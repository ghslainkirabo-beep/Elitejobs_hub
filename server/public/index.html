.it:hover{background:var(--s2);transform:translateX(3px)}.it.on{background:color-mix(in srgb,var(--ac) 16%,var(--s1));font-weight:800}.it.on:before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--ac)}

#top{display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--bd);background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);position:relative;z-index:5}

.sp{flex:1}.ib{height:38px;min-width:38px;padding:0 12px;border-radius:12px;border:1px solid var(--bd);background:var(--s1);cursor:pointer;transition:.2s;position:relative}

.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.k{background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:16px;position:relative;overflow:hidden;transition:.25s}.k:hover{transform:translateY(-4px);border-color:var(--ac)}
.k:after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:var(--ac);opacity:.12}
.k span{color:var(--mu);font-weight:600}.k b{display:block;font-size:34px;letter-spacing:-.03em}.k i{font-style:normal;color:var(--mu);font-size:12px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:16px}.card h3{margin:0 0 12px}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}

.feed div{padding:9px 0;border-bottom:1px solid var(--bd);animation:r .4s}.feed small{color:var(--mu)}

.bd{padding:2px 9px;border-radius:20px;font-size:12px;font-weight:800;background:var(--s2)}
.critical,.denied,.rejected{background:#ff4d6d22;color:#ff4d6d}.high,.open,.queued,.pending,.expected,.applied{background:#ffa94d22;color:#e8890c}.progress,.active,.in,.scheduled,.interview,.screening{background:#4d8dff22;color:#4d8dff}.resolved,.done,.approved,.hired,.offer,.out{background:#2ecc8f22;color:#17a870}
.b{border:1px solid var(--bd);background:var(--s1);border-radius:10px;padding:5px 11px;margin:2px;cursor:pointer;font-weight:600;transition:.15s}.b:hover{border-color:var(--ac);transform:translateY(-1px)}.b:active{transform:scale(.94)}.b.p{background:var(--ac);color:#fff;border-color:var(--ac)}
form.card{max-width:560px}label{display:block;margin:10px 0 4px;color:var(--mu);font-weight:600}input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--s2);font:inherit;color:inherit}textarea{resize:vertical;min-height:70px;line-height:1.5}

let lastNotifT=0;
function adopt(st){
  if(!st||typeof st!=='object')return;
  LISTS.forEach(k=>{if(!Array.isArray(st[k]))st[k]=[]});
  st.disabled=st.disabled||{};
  const fresh=st.notifs.filter(x=>(x.t||0)>lastNotifT&&(x.r==ui.me.r||x.r=='all')&&(!x.from||x.from!==ui.me.id));

// ---------- offline: keep working when the Hub PC is off ----------
// Every device keeps its own copy of the data. If the Hub can't be reached, work
// carries on and is saved here; when the Hub is back it's sent automatically and
// merged (newest change wins, item by item), so nothing typed offline is lost.

function setPending(v){PENDING=v;v?LS.set('pending-v1','1'):LS.del('pending-v1')}

// ---------- live channel ----------
let WS,UIV=null,PENDING_UI=null;
function connectHub(){
  WS=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/?key='+encodeURIComponent(officeKey()));
  WS.onopen=async()=>{NET_READY=true;if(PENDING)await flushPending();OFFLINE_TOLD=false;sendHello();render(true)};
  WS.onclose=ev=>{NET_READY=false;render(true);if(ev.code==4001){LS.del('office-key');showKeyGate('That passcode no longer works. Ask IT Support for the current one.');return}setTimeout(connectHub,2000)};
  WS.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
    if(m.type=='state'){if(PENDING)return;adopt(m.state);render(true)} // offline work is sent first, then the merged copy comes back
    if(m.type=='urgent')ugLive(m);
    if(m.type=='inq'){if(m.kind=='done'&&ui.iq)iqGone(m.id);else{const e=flat(ui.r)[ui.v];if(e&&(e.b=='inq'||e.b=='inqadmin')&&!ui.iq.sel)LOADERS[e.b]();iqMe()}}
    if(m.type=='webjobs'){const e=flat(ui.r)[ui.v];if(e&&e.b=='webjobs')LOADERS.webjobs()}
    if(m.type=='presence'){ONLINE=new Set(m.online||[]);render(true)}
    if(m.type=='att'&&ui.at&&ui.at.d&&m.day==ui.at.day){ui.at.d.records=m.records;const e=flat(ui.r)[ui.v];if(e&&e.b=='attendance'&&$('#gate').hidden)refreshMain()}
    if(m.type=='report'&&ui.me.r=='admin'){const e=flat(ui.r)[ui.v];if(e&&e.b=='reports')LOADERS.reports()}
    if(m.type=='ui'&&!PREVIEW){if(UIV===null)UIV=m.v;else if(m.v!==UIV){PENDING_UI=m.v;softReloadWhenIdle()}}
  };
}
// A new system version was deployed by IT: reload quietly when the person
// isn't in the middle of typing, and skip the welcome ceremony on the way back.
function softReloadWhenIdle(){
  if(!$('#gate').hidden){location.reload();return}
  toast('✨ A system update is ready — applying it in a moment');
  const tryIt=()=>{const ae=document.activeElement,busy=(ae&&ae.closest&&ae.closest('form'))||ui.modal;
    if(busy){setTimeout(tryIt,2000);return}
    try{sessionStorage.setItem('soft-resume',JSON.stringify({r:ui.r,v:ui.v}))}catch(e){}location.reload()};
  setTimeout(tryIt,2500);
}

async function startHub(){
  if(PENDING){const c=cachedState();if(c){S=c;snapBase();await flushPending()}} // work saved while the Hub was off goes first
  try{const r=await fetch('/api/state',{headers:hdrs()});if(r.status==401){LS.del('office-key');return showKeyGate()}const s=await r.json();if(s&&Object.keys(s).length)adopt(s);else snapBase();render(true)}catch(e){const c=cachedState();if(c){adopt(c);render(true);offlineNote()}}
  connectHub();loadAIS();
}
async function boot(){
  // The Hub PC gets its keys automatically; everyone else enters the passcode once.
  if(!officeKey()||!itKey()){try{const r=await fetch('/api/local-keys');if(r.ok){const k=await r.json();LS.set('office-key',k.office);LS.set('it-key',k.it)}}catch(e){}}
  if(!officeKey())return showKeyGate();
  const ok=await tryKey(officeKey());
  if(ok===null){const c=cachedState();if(c){adopt(c);render(true);offlineNote();connectHub();return}return showKeyGate('Can’t reach the Hub right now. Check that the Hub PC is on, then try again.')}

}

 <div class=wjgrid><form id=wjf class=wjform autocomplete=off>

  <label>What the person needs <small>(one per line)</small><textarea name=requirements rows=4>${esc(f.requirements||'')}</textarea></label>
  <label>A typical day <small>(optional, one per line)</small><textarea name=day rows=3>${esc(f.day||'')}</textarea></label>
  <label>What to bring <small>(optional, one per line — empty uses CV, ID, certificates)</small><textarea name=bring rows=3>${esc(f.bring||'')}</textarea></label>
  ${others.length?`<div class=wjnext><span>Where it can lead <small>(optional)</small></span><div>${others.map(j=>`<label class=chk><input type=checkbox name=next value="${esc(j.id)}"${(f.next||[]).includes(j.id)?' checked':''}> ${esc(j.title)}</label>`).join('')}</div></div>`:''}

 </form>
 <div class=wjside><div class=wjlbl>Preview on the website</div><div id=wjprev>${wjPreview(f,F)}</div>
  ${ui.wj.busy?`<p class=sub>⏳ Publishing to elitejobsrwanda.com…</p>`:btn(f.id?'Save changes':'Publish to the website','wjsave','p')}

V.webjobs=function(){const w=ui.wj,d=w.d;

 if(!d.configured)return`<div class=card><h3>🌐 Website jobs</h3><p class=sub>Not connected yet. IT connects it once: IT → System control → <b>Website jobs key</b>.</p></div>`;
 const can=d.canPublish,J=d.jobs||[],F=d.fields||{};
 const head=`<div class="card wjtop"><div><h3>🌐 Jobs on elitejobsrwanda.com</h3><p class=sub>${J.length} open ${J.length==1?'job':'jobs'} · each has its own page, shows in search and on Google.</p></div>${can&&!w.f?btn('＋ New job','wjnew','p'):''}</div>`;

 return head+(w.f?wjEditor(d):'')+`<div class="card wjlist">${rows||'<p class=sub>No jobs on the website yet.</p>'}</div>`+(can?'':`<p class=sub>Only Admin, or people Admin gave “Publish”, can change website jobs.</p>`)};

 async wjphotos(){const f=wjRead(),pk=ui.wj.ph=ui.wj.ph||{};const qs=eoQueries(f.title||'',f.category);if(!qs.length){pk.err='Type the job title first.';return refreshMain()}

  pk.busy=false;refreshMain()},
